[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awrecurse"
version = "0.1.0"
description = "Answer a question over a context far larger than the model's window — recursively, with the trace kept."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
awrecurse = "awrecurse.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awrecurse"
Documentation = "https://github.com/Aitherium/awrecurse#readme"
Repository = "https://github.com/Aitherium/awrecurse.git"
Issues = "https://github.com/Aitherium/awrecurse/issues"

[tool.setuptools]
packages = ["awrecurse"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The monorepo quality gate runs `ruff --isolated` from the REPO ROOT, where
# first-party detection cannot see this directory, so it files `awrecurse` as
# third-party. Rooted here, ruff would instead detect it as first-party and
# demand the OPPOSITE import layout -- two invocations giving mutually
# exclusive verdicts on the same file, each `--fix` undoing the other.
# Measured: that is exactly what happened, twice, before this line existed.
# Empty `src` disables path-based detection so the local run agrees with the
# gate that actually blocks a merge.
src = []

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
